version: 1
rules:
- id: B-PRINT
  title: print() in library code
  severity: required
  decidability: deterministic
  applies_to:
  - src/**/*.py
  exclude:
  - src/**/cli.py
  - src/**/__main__.py
  check:
    engine: ast
    rule: call
    names:
    - print
  message: Use the logging module (logger = logging.getLogger(__name__)) instead of print().
  fixtures:
    fail:
    - "def f(x):\n    print(x)\n"
    pass:
    - "import logging\nlog = logging.getLogger(__name__)\ndef f(x):\n    log.debug(x)\n"
- id: B-DOCSTRING
  title: Docstring longer than 5 lines
  severity: required
  decidability: deterministic
  applies_to:
  - src/**/*.py
  check:
    engine: ast
    rule: docstring-max-lines
    max: 5
  message: Shorten the docstring to at most 5 lines.
  fixtures:
    fail:
    - "def f():\n    \"\"\"a\n    b\n    c\n    d\n    e\n    f\n    \"\"\"\n"
    pass:
    - "def f():\n    \"\"\"One line.\"\"\"\n"
- id: B-TESTS-RO
  title: Existing test modified or deleted
  severity: critical
  decidability: deterministic
  check:
    engine: glob
    paths:
    - tests/**
    change:
    - modified
    - deleted
    - renamed
  message: Revert the change to the existing test; add new tests in new files instead.
  fixtures:
    fail:
    - tests/test_core.py
    pass:
    - src/pkg/core.py
- id: B-DEPS
  title: Dependency manifest changed
  severity: required
  decidability: deterministic
  check:
    engine: glob
    paths:
    - requirements*.txt
    - pyproject.toml
    - setup.py
    - setup.cfg
    - Pipfile
    - poetry.lock
    - uv.lock
  message: Do not add dependencies; this task must use the standard library only.
  fixtures:
    fail:
    - requirements.txt
    - pyproject.toml
    pass:
    - src/pkg/core.py
- id: B-RESTATE
  title: Comment restates the code
  severity: advisory
  decidability: heuristic
  applies_to:
  - src/**/*.py
  check:
    engine: python
    plugin: hygiene.restating_comment
    options:
      threshold: 0.8
  message: Delete comments that repeat the next line; explain why instead.
  fixtures:
    fail:
    - '# increment the counter

      counter += 1

      '
    pass:
    - '# retries start at 1 because attempt 0 is the initial call

      counter += 1

      '
- id: B-VOICE
  title: Filler phrase in a comment or docstring
  severity: advisory
  decidability: deterministic
  applies_to:
  - '**/*.py'
  - '**/*.sh'
  - '**/*.md'
  check:
    engine: regex
    true: added_lines
    within: comments
    flags:
    - i
    patterns:
    - \b(it is worth noting|it's worth noting|note that|simply|just|basically|obviously|clearly|of course)\b
    - \b(robust|seamless(ly)?|leverag(e|es|ing)|delve|comprehensive)\b
  message: Delete the filler word; state the fact directly.
  fixtures:
    fail:
    - '# Simply return the value

      '
    - '# A robust parser

      '
    pass:
    - '# Return the cached value

      '
- id: B-TODO
  title: TODO without an issue reference
  severity: required
  decidability: deterministic
  applies_to:
  - '**/*.py'
  - '**/*.sh'
  check:
    engine: regex
    true: added_lines
    within: comments
    pattern: \b(TODO|FIXME|XXX)\b(?!.*(#\d+|[A-Z]+-\d+))
  message: Remove the TODO or reference an issue, e.g. TODO(#12).
  fixtures:
    fail:
    - '# TODO handle unicode

      '
    pass:
    - '# TODO(#12) handle unicode

      '
    - 'x = 1

      '
- id: T15-NO-MD-LIBS
  title: Markdown parsing library imported
  severity: required
  decidability: deterministic
  applies_to:
  - '**/*.py'
  check:
    engine: ast
    rule: import
    names:
    - markdown
    - mistune
    - markdown_it
    - commonmark
  message: Parse the headings with the re module.
  fixtures:
    fail:
    - 'import mistune

      '
    pass:
    - 'import re

      '
