version: 1
pack: secrets
description: >-
  Common credential formats. The fixtures are synthetic strings built to match the patterns
  (all-zero or EXAMPLE bodies); they are not real credentials.
rules:
  - id: SEC-001
    title: Credential or private key in the change
    severity: critical
    decidability: deterministic
    exclude: ["**/packs/secrets.yaml", "**/*.lock", "**/package-lock.json"]
    check:
      engine: regex
      on: added_lines
      patterns:
        - '\bAKIA[0-9A-Z]{16}\b'
        - '\bgh[pousr]_[A-Za-z0-9]{36,}\b'
        - '\bgithub_pat_[A-Za-z0-9_]{60,}\b'
        - '-----BEGIN ((RSA|EC|DSA|OPENSSH|PGP|ENCRYPTED) )?PRIVATE KEY( BLOCK)?-----'
        - '\bxox[abposr]-[A-Za-z0-9-]{10,}\b'
        - '\bsk-ant-[A-Za-z0-9_-]{20,}\b'
        - '\bsk-(proj-)?[A-Za-z0-9]{32,}\b'
        - '\bAIza[0-9A-Za-z_-]{35}\b'
        - '\b[rs]k_live_[0-9a-zA-Z]{24,}\b'
        - '\bglpat-[0-9A-Za-z_-]{20,}\b'
    message: "Remove the credential from the change, rotate it, and load it from the environment or a secret store."
    fixtures:
      fail:
        - "AWS_ACCESS_KEY_ID=AKIAIOSFODNN7EXAMPLE\n"
        - "token = 'ghp_000000000000000000000000000000000000'\n"
        - "-----BEGIN OPENSSH PRIVATE KEY-----\n"
        - "ANTHROPIC_API_KEY=sk-ant-0000000000000000000000000000\n"
      pass:
        - "AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}\n"
        - "token = os.environ['GITHUB_TOKEN']\n"
        - "# keys look like ghp_<36 chars>\n"
    deviations: forbidden
    tags: [security]
