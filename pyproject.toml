[project]
name = "rulewarden"
version = "0.1.0.dev0"
description = "Deterministic runtime assurance for AI coding agents: enforce CLAUDE.md / AGENTS.md rules on diffs, fail-closed."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Thanatchon Chongmankhong" }]
requires-python = ">=3.11"
keywords = ["ai-agents", "claude-code", "agents-md", "policy", "runtime-assurance", "hooks", "linting"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: POSIX",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
  "Typing :: Typed",
]
dependencies = [
  "pyyaml>=6.0.2",
  "click>=8.1.7",
]

[project.urls]
Homepage = "https://github.com/thanatchon36/rulewarden"
Issues = "https://github.com/thanatchon36/rulewarden/issues"

[project.scripts]
rulewarden = "rulewarden.cli:main"

[dependency-groups]
dev = [
  "ruff>=0.6",
  "mypy>=1.11",
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "types-PyYAML>=6.0",
]
research = [
  "pandas>=2.2",
  "pyarrow>=17.0",
  "matplotlib>=3.9",
  "scipy>=1.14",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rulewarden"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["bench/tasks", "bench/recorded", "bench/.work", "corpus/data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "BLE", "T20"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["T20"]
"bench/**" = ["T20"]
"corpus/**" = ["T20"]
"paper/**" = ["T20"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:randomly --strict-markers"
markers = ["slow: long-running adversarial tests"]

[tool.coverage.run]
source = ["src/rulewarden"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\.$"]
